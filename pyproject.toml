[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-crawler-search-tfidf"
version = "0.1.0"
description = "小型礼貌爬虫与 TF-IDF 检索学习项目"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "jieba>=0.42",
    "url-normalize>=1.4",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools]
# 顶层模块与包；未列出的目录（data/、docs/、tests/ 等）不是发布内容
py-modules = ["config"]
packages = ["tokenizer", "crawler", "indexing", "search", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# archive/ 是历史归档材料，保持原样（连格式都不改），不参与检查
exclude = ["archive"]

[tool.ruff.lint]
# 未用导入/变量、常见错误、导入排序、pyupgrade、bugbear、简化建议、推导式、返回值
select = ["F", "E", "W", "I", "UP", "B", "SIM", "C4", "RET"]
ignore = ["E501"]  # 行宽由 formatter 语义处理，长字符串不强制折行

[tool.ruff.lint.per-file-ignores]
# 测试里的字面量与未用回调参数是固有噪声
"tests/*" = ["ARG002", "B011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["config.py", "crawler", "tokenizer", "indexing", "search", "web"]
# 标准库存根与实际返回类型不符的两处已知误报（见 docs/decisions.md D15）
disable_error_code = ["operator"]
